<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title th:text="${form.new ? 'New goal' : 'Edit goal'}">Goal</title></head>
<body>
<div layout:fragment="content">
    <div class="page-head">
        <div>
            <span class="eyebrow">Planning</span>
            <h1 th:utext="${form.new} ? 'A new <b>goal</b>' : 'Edit <b>goal</b>'">A new goal</h1>
        </div>
    </div>
    <div class="grid grid-form">
        <form class="card" th:action="@{/goals/save}" th:object="${form}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="card-body form-grid">
                <div class="field full"><label for="name">What are you saving for?</label><input type="text" th:field="*{name}" maxlength="80" placeholder="e.g. Goa trip"><div class="err" th:errors="*{name}"></div></div>
                <div class="field"><label for="targetAmount">Target</label>
                    <div class="money-input"><span th:text="${@fmt.symbol()}">₹</span><input type="number" step="1" min="1" id="targetAmount" name="targetAmount" th:value="${@fmt.plain(form.targetAmount)}" required></div>
                    <div class="err" th:errors="*{targetAmount}"></div></div>
                <div class="field"><label for="savedAmount">Saved already</label>
                    <div class="money-input"><span th:text="${@fmt.symbol()}">₹</span><input type="number" step="1" min="0" id="savedAmount" name="savedAmount" th:value="${@fmt.plain(form.savedAmount)}"></div>
                    <div class="err" th:errors="*{savedAmount}"></div></div>
                <div class="field"><label for="targetDate">Target date <span class="muted" style="text-transform:none;letter-spacing:0">(optional)</span></label><input type="date" th:field="*{targetDate}"><div class="err" th:errors="*{targetDate}"></div></div>
                <div class="field"><label for="color">Colour</label>
                    <div class="actions"><input type="color" th:field="*{color}" data-color-label="#colorValue"><span id="colorValue" class="mono"></span></div></div>
                <div class="field full"><label for="notes">Notes <span class="muted" style="text-transform:none;letter-spacing:0">(optional)</span></label><textarea th:field="*{notes}" maxlength="300"></textarea></div>
            </div>
            <div class="card-body form-actions form-foot">
                <a class="btn" th:href="@{/goals}">Cancel</a>
                <button class="btn primary" type="submit">Save goal</button>
            </div>
        </form>
        <div>
            <form class="card" th:unless="${form.new}" th:action="@{/goals/{id}/delete(id=${form.id})}" method="post" data-confirm="Delete this goal?">
                <div class="card-body">
                    <h3>Delete</h3>
                    <p class="muted">Removes the goal. Your accounts and transactions are not affected.</p>
                    <button class="btn danger" type="submit">Delete goal</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
