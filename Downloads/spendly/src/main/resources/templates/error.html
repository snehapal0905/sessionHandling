<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Error - Spendly</title><link rel="icon" th:replace="~{fragments :: favicon}"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<div class="error-page">
    <div class="code" th:text="${status}">500</div>
    <h1>Something went wrong</h1>
    <p class="muted" th:text="${error}">Unexpected error</p>
    <a class="btn primary" th:href="@{/dashboard}">Back to dashboard</a>
</div>
</body>
</html>
