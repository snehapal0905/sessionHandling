# Run without MySQL:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Data is kept in ./data/spendly.mv.db between restarts (delete the folder to start fresh)
spring.datasource.url=jdbc:h2:file:./data/spendly;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
