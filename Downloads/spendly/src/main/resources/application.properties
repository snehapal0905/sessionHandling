spring.application.name=spendly

# ---------- MySQL (default profile) ----------
# Override with env vars DB_URL / DB_USERNAME / DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spendly?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Web ----------
server.port=${PORT:8080}
spring.thymeleaf.cache=false
server.servlet.session.timeout=60m
spring.mvc.format.date=iso

# Create the demo account (demo / demo123) with six months of sample data on first start
spendly.seed-demo-data=true
